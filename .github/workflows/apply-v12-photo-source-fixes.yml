name: Apply V1.2 photo source fixes

# Triggered once after the workflow file exists on main.
on:
  push:
    paths:
      - '.github/workflows/apply-v12-photo-source-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V1.2 Home and About photo logic
        shell: python
        run: |
          from pathlib import Path

          path = Path('public/index.html')
          text = path.read_text(encoding='utf-8')

          old = '''<script>\nfunction init_home() {'''
          new = '''<script>
var snakeDbMediaPromise = null;
function getSnakeDbMedia() {
  if (!snakeDbMediaPromise) {
    snakeDbMediaPromise = fetch('/api/species-media?species_id=7', { headers: { 'Accept': 'application/json' } })
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function (data) {
        var rows = (data && data.media) || [];
        for (var i = 0; i < rows.length; i += 1) {
          if (rows[i] && rows[i].image_url) return rows[i];
        }
        return null;
      })
      .catch(function (err) { console.warn('[RoomForBoth] species 7 photo unavailable', err.message); return null; });
  }
  return snakeDbMediaPromise;
}
function snakeDbImageHtml(media) {
  if (!media || !media.image_url) return '';
  return '<img src="' + String(media.image_url).replace(/"/g, '&quot;') + '" alt="Snake" class="w-full h-full object-cover">';
}
function init_home() {'''
          if old not in text:
            raise SystemExit('init_home anchor not found')
          text = text.replace(old, new, 1)

          old = '''      creditEl.innerHTML = slides[i].dataset.creditEn;'''
          new = '''      creditEl.innerHTML = slides[i].dataset.creditEn;
      // Keep photo-source navigation consistent sitewide: Home first routes
      // to About the Data; the real external Wikimedia link lives there.
      creditEl.querySelectorAll('a').forEach(function (a) {
        a.removeAttribute('target');
        a.setAttribute('href', '#');
        a.onclick = function (e) { if (e) e.preventDefault(); goTo('about'); return false; };
      });'''
          if old not in text:
            raise SystemExit('carousel credit anchor not found')
          text = text.replace(old, new, 1)

          old = '''      animalBtnThumb.innerHTML = thumbHtml;'''
          new = '''      var selectedThumbHtml = (a.id === 'snake' && window.DB_SNAKE_MEDIA)
        ? snakeDbImageHtml(window.DB_SNAKE_MEDIA)
        : thumbHtml;
      animalBtnThumb.innerHTML = selectedThumbHtml;'''
          if old not in text:
            raise SystemExit('selected thumb anchor not found')
          text = text.replace(old, new, 1)

          old = '''  SPECIES.filter(function (a) { return a.id !== 'general'; }).forEach(function (a) {
    addAnimalOption(a, a.en, a.bm);
  });

  var generalSpecies = SPECIES.filter(function (a) { return a.id === 'general'; })[0];'''
          new = '''  SPECIES.filter(function (a) { return a.id !== 'general'; }).forEach(function (a) {
    addAnimalOption(a, a.en, a.bm);
  });

  // Snake is a generic safety path in the static dataset, but the Home
  // selector is allowed to use one representative sourced photo. Use the
  // database media for species_id 7 (cobra) and replace the generic icon.
  getSnakeDbMedia().then(function (media) {
    if (!media) return;
    window.DB_SNAKE_MEDIA = media;
    var row = animalListEl.querySelector('[data-value="snake"]');
    if (row) {
      var thumb = row.querySelector('span.w-7.h-7');
      if (thumb) thumb.innerHTML = snakeDbImageHtml(media);
    }
    if (animalSelectEl.value === 'snake') {
      animalBtnThumb.innerHTML = snakeDbImageHtml(media);
      animalBtnThumb.classList.remove('hidden');
      animalBtnThumb.classList.add('flex');
    }
  });

  var generalSpecies = SPECIES.filter(function (a) { return a.id === 'general'; })[0];'''
          if old not in text:
            raise SystemExit('species loop anchor not found')
          text = text.replace(old, new, 1)

          old = '''  var body = document.getElementById('about_actionSourceBody');'''
          new = '''  // The static SPECIES table intentionally has no snake photo because the
  // safety flow does not identify a snake species. For attribution on About
  // the Data, add the representative database image from species_id 7.
  if (photoList) {
    getSnakeDbMedia().then(function (media) {
      if (!media || photoList.querySelector('[data-db-snake-photo="1"]')) return;
      var sourceUrl = media.source_url || media.stored_image_url || media.image_url;
      var credit = media.photographer ? 'Photo: ' + media.photographer : 'Database photo — species ID 7';
      if (media.licence) credit += ' · ' + media.licence;
      var row = document.createElement('div');
      row.setAttribute('data-db-snake-photo', '1');
      row.className = 'flex items-center gap-4 rounded-xl border border-slate-200 bg-slate-50/60 px-4 py-3';
      row.innerHTML =
        '<div class="w-12 h-12 rounded-lg overflow-hidden shrink-0 border border-slate-200 bg-white">' + snakeDbImageHtml(media) + '</div>' +
        '<div class="min-w-0 flex-1"><div class="font-display font-bold text-sm text-slate-900">Snake <span class="font-normal italic text-slate-400">/ Ular</span></div>' +
        '<div class="text-xs text-slate-500 mt-0.5">' + credit + '</div></div>' +
        '<a href="' + sourceUrl + '" target="_blank" rel="noopener" class="shrink-0 text-forest-600 hover:text-forest-800 text-xs font-bold inline-flex items-center gap-1"><span data-en>View source</span><span data-bm>Lihat sumber</span> ↗</a>';
      photoList.appendChild(row);
      setLang(localStorage.getItem('owm-lang') || 'en');
    });

    // Home hero credits also route here first. Their real external source
    // links are listed below so users can inspect attribution before leaving.
    var heroPhotos = [
      { en: 'Homepage background — Malayan Sun Bear', bm: 'Latar halaman utama — Beruang Matahari Malaya', credit: 'BirdPhotos.com · CC BY 3.0', image: 'https://commons.wikimedia.org/wiki/Special:FilePath/Malaysian_Sun_Bear.jpg?width=240', source: 'https://commons.wikimedia.org/wiki/File:Malaysian_Sun_Bear.jpg' },
      { en: 'Homepage background — Malayan Tapir', bm: 'Latar halaman utama — Tapir Malaya', credit: 'Just chaos · CC BY 2.0', image: 'https://commons.wikimedia.org/wiki/Special:FilePath/Malayan_Tapir4.jpg?width=240', source: 'https://commons.wikimedia.org/wiki/File:Malayan_Tapir4.jpg' },
      { en: 'Homepage background — Rhinoceros Hornbill', bm: 'Latar halaman utama — Enggang Badak', credit: 'abzahri · CC BY 2.0', image: 'https://commons.wikimedia.org/wiki/Special:FilePath/Buceros_rhinoceros_-Kuala_Lumpur_Bird_Park%2C_Malaysia-8a_%282%29.jpg?width=240', source: 'https://commons.wikimedia.org/wiki/File:Buceros_rhinoceros_-Kuala_Lumpur_Bird_Park,_Malaysia-8a_(2).jpg' }
    ];
    heroPhotos.forEach(function (p) {
      var row = document.createElement('div');
      row.setAttribute('data-home-hero-source', '1');
      row.className = 'flex items-center gap-4 rounded-xl border border-slate-200 bg-slate-50/60 px-4 py-3';
      row.innerHTML =
        '<div class="w-12 h-12 rounded-lg overflow-hidden shrink-0 border border-slate-200 bg-white"><img src="' + p.image + '" alt="" class="w-full h-full object-cover"></div>' +
        '<div class="min-w-0 flex-1"><div class="font-display font-bold text-sm text-slate-900"><span data-en>' + p.en + '</span><span data-bm>' + p.bm + '</span></div><div class="text-xs text-slate-500 mt-0.5">' + p.credit + '</div></div>' +
        '<a href="' + p.source + '" target="_blank" rel="noopener" class="shrink-0 text-forest-600 hover:text-forest-800 text-xs font-bold inline-flex items-center gap-1"><span data-en>View source</span><span data-bm>Lihat sumber</span> ↗</a>';
      photoList.appendChild(row);
    });
  }

  var body = document.getElementById('about_actionSourceBody');'''
          if old not in text:
            raise SystemExit('about body anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          print('patched bytes:', path.stat().st_size)

      - name: Commit patched frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix V1.2 snake photos and photo source routing"
          git push
