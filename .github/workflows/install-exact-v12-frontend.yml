name: Install exact V1.2 frontend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-exact-v12-frontend.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify exact V1.2 frontend
        run: |
          cat scripts/v12-patch2/chunk-*.b64 > /tmp/v12.patch.gz.b64
          test "$(sha256sum /tmp/v12.patch.gz.b64 | cut -d' ' -f1)" = "56fd4f3c045998d69913071d06ac48f99a2a1e93bb89fa2cb07d3302746f2de7"
          base64 -d /tmp/v12.patch.gz.b64 > /tmp/v12.patch.gz
          test "$(sha256sum /tmp/v12.patch.gz | cut -d' ' -f1)" = "355860217f22680320346e48ecc6a3e08290c5498dc326cbb04b8b0dbe3beee9"
          gzip -d -c /tmp/v12.patch.gz > /tmp/v17-to-v12.patch
          cp archive/legacy-html/room_for_both_v17.html /tmp/index-v12.html
          patch /tmp/index-v12.html < /tmp/v17-to-v12.patch
          test "$(wc -c < /tmp/index-v12.html)" = "495440"
          test "$(git hash-object /tmp/index-v12.html)" = "3aad17a18230eaf2e473473cd5183a02f7111707"
          test "$(git hash-object public/api-data.js)" = "0c36636e06227a4d32897f9e4dec9fa3d9333fce"
          cp /tmp/index-v12.html public/index.html

      - name: Commit exact frontend and clean staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git rm -r scripts/v12-patch || true
          git rm -r scripts/v12-patch2
          git rm -r public/v12-source || true
          git commit -m "Install exact V1.2 frontend"
          git push
