name: Apply DB-only frontend

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/production-data-status.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove embedded business fallback
        run: python scripts/apply_db_only_frontend.py

      - name: Restore presentation photos as frontend static media
        run: node scripts/use-frontend-media.js

      - name: Commit frontend media separation when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/api-data.js public/frontend-media.js
          if git diff --cached --quiet; then
            echo "Frontend is already using static presentation media with DB-only business data"
            exit 0
          fi
          git commit -m "Use frontend static species photos"
          git push
