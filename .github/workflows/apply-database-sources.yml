name: Apply database-backed About Data

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-database-sources.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch backend and frontend
        run: node scripts/apply-database-sources.mjs
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "Database source migration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.js public/index.html public/api-data.js
          git commit -m "Drive About the Data from Neon sources"
          git pull --rebase origin main
          git push origin main
