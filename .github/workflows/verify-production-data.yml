name: Verify production data

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply DB multi-source frontend fix
        run: |
          python scripts/fix-db-multi-source-rendering.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/api-data.js
          if git diff --cached --quiet; then
            echo "No frontend DB changes to commit."
          else
            git commit -m "Fix database multi-source rendering"
            git push
          fi

      - name: Verify production database
        run: |
          BASE='https://5120-tm01-project.myee0021.workers.dev'
          curl -fsS "$BASE/api/data-status" | grep -q '"ok":true'
          curl -fsS "$BASE/api/immediate-actions?species_id=5" | grep -q '"ok":true'
          echo "Production database verification passed."
