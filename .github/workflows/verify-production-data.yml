name: Verify production data

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply static Naja photo and split Homepage sources
        run: |
          mkdir -p public/assets
          python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path

          api = 'https://api.inaturalist.org/v1/taxa/106451'
          req = urllib.request.Request(api, headers={'User-Agent':'RoomForBoth/1.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)
          taxon = data['results'][0]
          photo = taxon.get('default_photo') or {}
          url = photo.get('medium_url') or photo.get('url') or photo.get('large_url')
          if not url:
              raise SystemExit('No Naja sumatrana default photo returned by iNaturalist')
          req = urllib.request.Request(url, headers={'User-Agent':'RoomForBoth/1.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              raw = r.read()
          out = Path('public/assets/naja-sumatrana.jpg')
          out.write_bytes(raw)
          print('Naja source:', url)
          print('Naja bytes:', len(raw))
          print('Naja sha256:', hashlib.sha256(raw).hexdigest())
          print('Uploaded ZIP reference sha256: 946f593099b37d3a74c641c39646fcce346cbe5a2e5a5b7e441e81c16c6e2efb')
          PY

          python scripts/apply-static-snake-homepage-section.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/assets/naja-sumatrana.jpg
          if git diff --cached --quiet; then
            echo "No frontend changes to commit."
            exit 0
          fi
          git commit -m "Use static Naja photo and separate homepage sources"
          git push

      - name: Verify read-only production database
        run: |
          BASE='https://5120-tm01-project.myee0021.workers.dev'
          curl -fsS "$BASE/api/data-status" | grep -q '"ok":true'
          echo "Production database verification passed."
