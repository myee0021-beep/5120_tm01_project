name: Verify production data

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Cloudflare deployment and verify database status
        run: |
          BASE='https://5120-tm01-project.myee0021.workers.dev'
          ok=0
          for attempt in $(seq 1 24); do
            if curl -fsS "$BASE/api/data-status" -o /tmp/data-status.json && grep -q '"ok":true' /tmp/data-status.json; then
              ok=1
              break
            fi
            echo "Waiting for deployment ($attempt/24)..."
            sleep 10
          done
          test "$ok" = 1

          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('/tmp/data-status.json').read_text())
          assert status.get('ok') is True, status
          tables = status.get('tables', {})
          required = ['animal_category','authority','immediate_action','prevention_action','species','species_behaviour','state']
          missing = [name for name in required if name not in tables]
          assert not missing, f'Missing expected tables from production status: {missing}'
          print(json.dumps(status, indent=2, ensure_ascii=False))
          PY

      - name: Verify read-only business APIs
        run: |
          BASE='https://5120-tm01-project.myee0021.workers.dev'
          curl -fsS "$BASE/api/species" | grep -q '"ok":true'
          curl -fsS "$BASE/api/categories" | grep -q '"ok":true'
          curl -fsS "$BASE/api/states" | grep -q '"ok":true'
          curl -fsS "$BASE/api/species-behaviour?species_id=1" | grep -q '"ok":true'
          curl -fsS "$BASE/api/immediate-actions?species_id=1" | grep -q '"ok":true'
          curl -fsS "$BASE/api/prevention-actions?species_id=1" | grep -q '"ok":true'
          echo "Production database verification passed."

      - name: Verify production frontend version
        run: |
          BASE='https://5120-tm01-project.myee0021.workers.dev'
          curl -fsS -H 'Cache-Control: no-cache' "$BASE/?verify=$(date +%s)" -o /tmp/prod-index.html
          echo "Production HTML bytes: $(wc -c < /tmp/prod-index.html)"
          if grep -q 'about-db-sources-inline-v5' /tmp/prod-index.html; then
            echo 'FRONTEND_V5_PRESENT=yes'
          else
            echo 'FRONTEND_V5_PRESENT=no'
            echo '--- Production About copy sample ---'
            grep -o 'Every "Source" note[^<]*' /tmp/prod-index.html | head -1 || true
            exit 1
          fi
