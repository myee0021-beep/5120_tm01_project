name: Verify production data

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply V1.2 flow fixes
        run: |
          python scripts/apply-v12-flow-fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if git diff --cached --quiet; then
            echo "No frontend changes to commit."
          else
            git commit -m "Update V1.2 identify flow and navigation"
            git push
          fi

      - name: Verify read-only production database
        run: |
          BASE='https://5120-tm01-project.myee0021.workers.dev'
          curl -fsS "$BASE/api/data-status" | grep -q '"ok":true'
          curl -fsS "$BASE/api/species" | grep -q '"ok":true'
          echo "Production database verification passed."
